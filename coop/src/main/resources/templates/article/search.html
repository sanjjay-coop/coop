<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
						
		<h4 class="h4 p-2">Articles (All Categories)</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		
		<form class="row g-3 align-items-center p-2"  th:action="@{/article/search/list}" th:object="${article}" method="POST">
			  <div class="col-auto">
			    <div class="input-group">
			      <div class="input-group-text">Search String</div>
			      <input type="text" class="form-control" th:field="*{searchFor}" placeholder="Search for...">
			    </div>
			  </div>
			
			  <div class="col-auto">
			    <button type="submit" class="btn btn-sm btn-secondary">Submit</button>
			  </div>
		</form>
		
		<div class="row p-2">
			<div class="h6 pb-2" th:text="'Total Records: ' + ${totalRecords}"></div>		
			
			<div class="col-md-12 p-2 my-1 bg-white rounded-3 border border-light-subtle" th:each="article : ${listArticle}">
				<div class="h5 text-success pb-2 px-4 pt-2 rounded-2 bg-primary-subtle bg-gradient">
					<a class="nav-link" th:href="@{/article/view/{id}(id=${article.id})}">
						<i class="bi bi-card-heading"></i>&nbsp;&nbsp;<span th:text="${article.title}"></span>
					</a>
				</div>
				<div class="px-3 py-3" th:utext="${article.content} + ' ...'"></div>
				
				<div class="small px-3 pt-1 pb-3">
					<i class="bi bi-person-circle"></i> <span th:text="${article.author}"></span>
					&nbsp;&nbsp;&nbsp;&nbsp;<i class="bi bi-calendar"></i> <span th:text="${#dates.format(article.updateDate, 'dd-MM-yyyy')}"></span>
					&nbsp;&nbsp;&nbsp;&nbsp;<i class="bi bi-tags"></i> <span th:each="cat : ${article.categories}" th:text="${cat.name + ', '}"></span>
				</div>
			</div>
		
		</div>
		
		<nav aria-label="Page Navigation">
			<ul class="pagination">
				<li class="page-item" th:if="${!firstPage}"><a class="page-link text-primary" th:href="@{/article/search/list}"><i class="bi bi-chevron-bar-left"></i></a></li>
				<li class="page-item" th:if="${!firstPage}"><a class="page-link text-primary" th:href="@{/article/search/list/previous}"><i class="bi bi-chevron-left"></i></a></li>
				<li class="page-item"><a class="page-link text-primary" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
				<li class="page-item" th:if="${!lastPage}"><a class="page-link text-primary" th:href="@{/article/search/list/next}"><i class="bi bi-chevron-right"></i></a></li>
				<li class="page-item" th:if="${!lastPage}"><a class="page-link text-primary" th:href="@{/article/search/list/last}"><i class="bi bi-chevron-bar-right"></i></a></li>
			</ul>
		</nav>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
</body>
</html>
