<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<h4 class="h4 pb-3" th:text="${'Articles (Category: ' + category.name + ')' }"></h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
					
				<div class="card p-2 mb-3" th:each="article : ${listArticle}">
					<h5 class="card-header bg-success-subtle bg-gradient" th:text="${article.title}"></h5>
				  	<div class="card-body">
						<p th:utext="${article.content}"></p>
						<div style="font-size: small;">
							<b>Categories: </b>
							<span th:each="cat : ${article.categories}" th:text="${cat.name + ', '}"></span>
							<b> Last Update: </b>
							<span th:text="${#dates.format(article.updateDate, 'dd/MM/yyyy')}"></span>
						</div>
				  	</div>
				</div>
						
				<nav aria-label="Page navigation example" th:if="${totalPages > 1}">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}">
							<a class="page-link text-success" th:href="@{/article/blog/{categoryId}(categoryId=${category.id})}"><i class="bi bi-chevron-bar-left"></i></a>
						</li>
						<li class="page-item" th:if="${!firstPage}">
							<a class="page-link text-success" th:href="@{/article/blog/{categoryId}/previous(categoryId=${category.id})}"><i class="bi bi-chevron-left"></i></a>
						</li>
						<li class="page-item">
							<a class="page-link text-success" th:text="${currentPage + '... of ...' + totalPages}"></a>
						</li>
						<li class="page-item" th:if="${!lastPage}">
							<a class="page-link text-success" th:href="@{/article/blog/{categoryId}/next(categoryId=${category.id})}"><i class="bi bi-chevron-right"></i></a>
						</li>
						<li class="page-item" th:if="${!lastPage}">
							<a class="page-link text-success" th:href="@{/article/blog/{categoryId}/last(categoryId=${category.id})}"><i class="bi bi-chevron-bar-right"></i></a>
						</li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
