<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<h4 class="h4 pb-3">Holiday (List All)</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<form class="row g-3 align-items-center py-3"  th:action="${servletRequest.requestURI}" th:object="${holiday}" method="POST">
					  <div class="col-auto">
					    <div class="input-group">
					      <div class="input-group-text">Search String</div>
					      <input type="text" class="form-control" th:field="*{searchFor}" placeholder="Search for...">
					    </div>
					  </div>
					
					  <div class="col-auto">
					    <button type="submit" class="btn btn-sm btn-secondary">Submit</button>
					  </div>
				</form>
				
				<div class="h6" th:text="'Total Records: ' + ${totalRecords}"></div>
				
				<div class="row g-3">
					<div class="col-sm-2 pb-2" th:each="ob,iterator : ${listHoliday}">
						<div class="card h-100">
							<h5 class="card-header text-center bg-gradient" th:text="${#dates.format(ob.date, 'dd-MM-yyyy')}" th:classappend="${ob.date.after(#dates.createNow())} ? 'bg-success-subtle' : 'bg-warning-subtle'"></h5>
						  	<div class="card-body text-center">
						  		<div class="small m-3" th:text="${#dates.dayOfWeekName(ob.date)}"></div>	
						  		<div class="text-success" th:text="${ob.name}"></div>			  		
						  	</div>
						</div>
					</div>
				</div>
				
				<nav aria-label="Page navigation example" th:if="${totalPages > 0}">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link text-success" th:href="@{/home/holiday/list}"><i class="bi bi-chevron-bar-left"></i></a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link text-success" th:href="@{/home/holiday/list/previous}"><i class="bi bi-chevron-left"></i></a></li>
						<li class="page-item"><a class="page-link text-success" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link text-success" th:href="@{/home/holiday/list/next}"><i class="bi bi-chevron-right"></i></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link text-success" th:href="@{/home/holiday/list/last}"><i class="bi bi-chevron-bar-right"></i></a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
