<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<h3 class="fw-bold pb-3">Invitation (My List)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/home/invitation/addNew}">Add New Invitation</a>
						</div>
					</div>
				</div>
				
				<form class="row g-3 align-items-center py-3"  th:action= "${servletRequest.requestURI}" th:object="${invitation}" method="POST">
					  <div class="col-auto">
					    <div class="input-group">
					      <div class="input-group-text">Search String</div>
					      <input type="text" class="form-control" th:field="*{searchFor}" placeholder="Search for...">
					    </div>
					  </div>
					
					  <div class="col-auto">
					    <button type="submit" class="btn btn-sm btn-secondary">Submit</button>
					  </div>
				</form>
							
				<table class="table table-sm table-bordered table-striped">
				
					<thead>
						<tr>
							<th th:text="#{invitation.email}"></th>
							<th th:text="#{invitation.name}"></th>
							<th th:text="#{invitation.date}"></th>
							<th>Email Date</th>
							<th th:text="#{invitation.status}"></th>
							<th style="width: 15px;">Resend</th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob : ${listInvitation}">
							<td th:text="${ob.email}"></td>
							<td th:text="${ob.name}"></td>
							<td th:text="${#dates.format(ob.date, 'dd/MM/yyyy hh:mm:ss')}"></td>
							<td th:text="${#dates.format(ob.updateDate, 'dd/MM/yyyy hh:mm:ss')}"></td>
							<td th:text="${ob.status}"></td>
							<td>
								<div th:if="${ob.resendPossible == true}">
									<a th:if="${ob.status != true}" class="nav-link" th:href="@{/home/invitation/resend/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
						      	    	<img th:src="@{/images/bootstrap-icons/arrow-clockwise.svg}" alt="Resend-Invitation"/>
						      	  </a>
					       	 </div>
							</td>
						</tr>
					</tbody>
				</table>
				<nav aria-label="Page navigation example" th:if="${totalPages > 0}">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/home/invitation/list}">First</a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/home/invitation/list/previous}">Previous</a></li>
						<li class="page-item"><a class="page-link" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/home/invitation/list/next}">Next</a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/home/invitation/list/last}">Last</a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
