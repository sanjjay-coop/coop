<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h3 class="fw-bold pb-3">Invitation (Add New)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<form th:action= "${servletRequest.requestURI}" th:object="${invitation}" method="POST">

					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label text-primary" th:text="#{invitation.email}"></label>
							<input type="text" class="form-control required" th:field="*{email}" th:placeholder="#{invitation.email}" autofocus >
							<ul><li class="cooperror" th:errors="*{email}" /></ul>
						</div>
						<div class="col-md-6">
							<label class="form-label text-primary" th:text="#{invitation.name}"></label>
							<input type="text" class="form-control required" th:field="*{name}" th:placeholder="#{invitation.name}">
							<ul><li class="cooperror" th:errors="*{name}" /></ul>
						</div>
						<div class="col-md-12">
				    		<button type="submit" class="btn btn-primary">Submit</button>
				    	</div>
				  	</div>
				</form>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
