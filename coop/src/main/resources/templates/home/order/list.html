<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
				
		<h4 class="h4 p-2">Orders</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>

		<form class="row g-3 align-items-center p-2"  th:action= "${servletRequest.requestURI}" th:object="${order}" method="POST">
			  <div class="col-auto">
			    <div class="input-group">
			      <div class="input-group-text">Search String</div>
			      <input type="text" class="form-control" th:field="*{searchFor}" placeholder="Search for...">
			    </div>
			  </div>
			
			  <div class="col-auto">
			    <button type="submit" class="btn btn-sm btn-secondary">Submit</button>
			  </div>
		</form>
		
		<div class="h6 p-2" th:utext="'<b>Total Records:</b> ' + ${totalRecords}"></div>
		<div class="row p-2">
			<div class="col-12">
				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th class="col-sm-1" th:text="'S/N'"></th>
							<th th:text="#{order.subject}"></th>
							<th class="col-sm-2" th:text="#{order.orderNumber}"></th>
							<th class="col-sm-2" th:text="#{order.orderDate}"></th>
							<th class="col-sm-2" th:text="#{order.orderCategory}"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listOrder}">
        					<td th:text="${20 * (currentPage - 1) + iterator.index + 1}"></td>
        					<td th:text="${ob.subject}"></td>
        					<td th:text="${ob.orderNumber}"></td>
        					<td th:text="${#dates.format(ob.orderDate, 'dd-MM-yyyy')}"></td>
        					<td th:text="${ob.orderCategory.name}"></td>
        					<td>
        						<a class="nav-link" target="_blank" th:href="@{/home/order/file/{orderId}(orderId=${ob.id})}" title="Download File">
							  		<i class="bi bi-download"></i>
							  	</a>
							</td> 
						</tr>
					</tbody>
				</table>
				<nav aria-label="Page Navigation" th:if="${totalPages > 0}">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link text-success" th:href="@{/home/order/list}"><i class="bi bi-chevron-bar-left"></i></a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link text-success" th:href="@{/home/order/list/previous}"><i class="bi bi-chevron-left"></i></a></li>
						<li class="page-item"><a class="page-link text-success" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link text-success" th:href="@{/home/order/list/next}"><i class="bi bi-chevron-right"></i></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link text-success" th:href="@{/home/order/list/last}"><i class="bi bi-chevron-bar-right"></i></a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div> 
	
</body>
</html>
