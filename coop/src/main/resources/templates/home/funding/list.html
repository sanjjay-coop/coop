<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<h4 class="h4 pb-3">Application for Funding</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-success btn-sm" role="button" th:href="@{/home/funding/addNew}">
								<i class="bi bi-plus-circle"></i> Application</a>
						</div>
					</div>
				</div>
			
				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th class="col-sm-1" th:text="'S/N'"></th>
							<th th:text="#{funding.name}"></th>
							<th class="col-sm-2" th:text="#{funding.email}"></th>
							<th class="col-sm-2" th:text="#{funding.applicationDate}"></th>
							<th class="col-sm-3" th:text="#{funding.purpose}"></th>
							<th class="col-sm-1" th:text="#{funding.status}"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listFunding}">
							<td th:text="${iterator.index + 1}"></td>
        					<td th:text="${ob.name}"></td>
							<td th:text="${ob.email}"></td>
							<td th:text="${#dates.format(ob.applicationDate, 'dd/MM/yyyy hh:mm:ss')}"></td>
							<td th:text="${ob.purpose}"></td>
							<td th:text="${ob.status}"></td>
							<td>
								<a class="nav-link" th:href="@{/home/funding/view/{orderId}(orderId=${ob.id})}" title="View Record">
							      	<i class="bi bi-folder2-open"></i>
							    </a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
