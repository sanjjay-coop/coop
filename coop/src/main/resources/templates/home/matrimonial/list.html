<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<h3 class="fw-bold pb-3">Matrimonial (My List)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/home/matrimonial/addNew}">Add New Matrimonial</a>
						</div>
					</div>
				</div>
				
				<table class="table table-sm table-bordered table-striped">
				
					<thead>
						<tr>
							<th th:text="#{matrimonial.lookingFor}"></th>
							<th th:text="#{matrimonial.description}"></th>
							<th th:text="#{matrimonial.mobile}"></th>
							<th th:text="#{matrimonial.email}"></th>
							<th th:text="#{matrimonial.enabled}"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob : ${listMatrimonial}">
        					<td th:text="${ob.lookingFor}"></td>
        					<td th:text="${ob.description}"></td>
        					<td th:text="${ob.mobile}"></td>
        					<td th:text="${ob.email}"></td>
							<td th:text="${ob.enabled}"></td>
        					<td>
        						<a class="nav-link" th:href="@{/home/matrimonial/edit/{orderId}(orderId=${ob.id})}">
						          	<img th:src="@{/images/bootstrap-icons/pencil-square.svg}"/>
						        </a>
        					</td>
        					<td>
		        				<a class="nav-link" th:href="@{/home/matrimonial/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')">
						          	<img th:src="@{/images/bootstrap-icons/trash-fill.svg}"/>
						        </a>
        					</td>
						</tr>
					</tbody>
				</table>
				<div class="row p-2 text-align-center" th:if="${totalPages > 0}">
					<nav aria-label="Page navigation example" th:if="${totalPages > 0}">
						<ul class="pagination">
							<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/home/matrimonial/list}">First</a></li>
							<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/home/matrimonial/list/previous}">Previous</a></li>
							<li class="page-item"><a class="page-link" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
							<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/home/matrimonial/list/next}">Next</a></li>
							<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/home/matrimonial/list/last}">Last</a></li>
						</ul>
					</nav>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
