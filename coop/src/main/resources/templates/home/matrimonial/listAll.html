<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row p-2">

			<div class="col-12">
				
				<h3 class="pageTitle">Matrimonials</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="card p-1" th:each="ob : ${listMatrimonialAll}">
					<h5 class="card-header" th:text="${ob.lookingFor}"/>
				  	<div class="card-body">
						<label style="font-weight: bold;" th:text="#{matrimonial.expDescription}" /> : <span th:text="${ob.expDescription}" /> 
						<label style="font-weight: bold;" th:text="#{matrimonial.expEducation}" /> : <span th:text="${ob.expEducationLevel.name}" /> 
						<label style="font-weight: bold;" th:text="#{matrimonial.expOccupation}" /> : <span th:text="${ob.expOccupation.name}" /> 
						<label style="font-weight: bold;" th:text="#{matrimonial.expMinAge}" /> : <span th:text="${ob.expMinAge}" /> 
						<label style="font-weight: bold;" th:text="#{matrimonial.expMaxAge}" /> : <span th:text="${ob.expMaxAge}" /> 
						<br/><br/>
						<label style="font-weight: bold;">Applicant Details</label>
						<br/>
						<label style="font-weight: bold;" th:text="#{matrimonial.description}" /> : <span th:text="${ob.description}" /> 
						<label style="font-weight: bold;" th:text="#{matrimonial.age}" /> : <span th:text="${ob.age}" /> 
						<label style="font-weight: bold;" th:text="#{matrimonial.education}" /> : <span th:text="${ob.educationLevel.name}" /> 
						<label style="font-weight: bold;" th:text="#{matrimonial.occupation}" /> : <span th:text="${ob.occupation.name}" /> 
						<label style="font-weight: bold;" th:text="#{matrimonial.mobile}" /> : <span th:text="${ob.mobile}" /> 
						<label style="font-weight: bold;" th:text="#{matrimonial.email}" /> : <span th:text="${ob.email}" />
				  	</div>
				</div>
				<br/>
				<nav aria-label="Page navigation example">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/home/matrimonial/all/list}">First</a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/home/matrimonial/all/list/previous}">Previous</a></li>
						<li class="page-item"><a class="page-link" th:text="${currentPage + '... of ...' + totalPages}" /></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/home/matrimonial/all/list/next}">Next</a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/home/matrimonial/all/list/last}">Last</a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
