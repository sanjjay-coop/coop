<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<h3 class="fw-bold pb-3">Title (Details)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/home/title/searchResult}">To Search List</a>
						</div>
					</div>
				</div>

				<div class="row g-3">
					<div class="col-md-3">
				    	<label class="form-label text-primary" th:text="#{title.accessionNumber}"></label>
				    	<span class="form-control" th:text="${title.accessionNumber}"></span>
				    </div>
					<div class="col-md-9">
						<label class="form-label text-primary" th:text="#{title.uniformTitle}"></label>
						<span class="form-control" th:text="${title.uniformTitle}"></span>
					</div>
					<div class="col-md-12">
						<label class="form-label text-primary" th:text="#{title.authors}"></label>
						<span class="form-control" th:text="${title.authors}"></span>
					</div>
					<div class="col-md-4">
						<label class="form-label text-primary" th:text="#{title.titleType}"></label>
						<span class="form-control" th:text="${title.titleType.name}"></span>
					</div>
					<div class="col-md-8">
						<label class="form-label text-primary" th:text="#{title.library}"></label>
						<span class="form-control" th:text="${title.library.name + ' [' + title.library.shortName + ']'}"></span>
					</div>
					<div class="col-md-12">
						<label class="form-label text-primary" th:text="#{title.summary}"></label>
						<span class="form-control" th:text="${title.summary}"></span>
					</div>
					<div class="col-md-4" th:if="${co!=null}">
						<label class="form-label text-primary" th:text="#{checkOut}"></label>
						<span class="form-control" th:text="${co.member.name + ' [' + co.member.memId + ']' }"></span>
					</div>
					<div class="col-md-4" th:if="${co!=null}">
						<label class="form-label text-primary">Issue Date</label>
						<span class="form-control" th:text="${#dates.format(co.transactionDate, 'dd/MM/yyyy')}"></span>
					</div>
					<div class="col-md-4" th:if="${co!=null}">
						<label class="form-label text-primary">Due Date</label>
						<span class="form-control" th:text="${#dates.format(co.dueDate, 'dd/MM/yyyy')}"></span>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
