<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<h4 class="h4 pb-3">Jobs (My List)</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/home/job/addNew}">
								<img th:src="@{/images/bootstrap-icons/plus-circle.svg}"/>&nbsp; Add Job</a>
						</div>
					</div>
				</div>
				
				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th class="col-sm-1" th:text="'S/N'"></th>
							<th class="col-sm-2" th:text="#{job.position}"></th>
							<th th:text="#{job.firmName}"></th>
							<th class="col-sm-1 text-center" th:text="#{job.salary}"></th>
							<th class="col-sm-1 text-center" th:text="#{job.lastDate}"></th>
							<th class="col-sm-1 text-center" th:text="#{job.enabled}"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listJob}">
        					<td th:text="${20 * (currentPage - 1) + iterator.index + 1}"></td>
        					<td th:text="${ob.position}"></td>
							<td th:text="${ob.firmName}"></td>
        					<td class="text-center" th:text="${ob.salary}"></td>
        					<td class="text-center" th:text="${#dates.format(ob.lastDate, 'dd/MM/yyyy')}"></td>
							<td class="text-center" th:text="${ob.enabled}"></td>
        					<td>
        						<a th:if="${ob.fileData != null}" class="nav-link" target="_blank" th:href="@{/home/job/file/{orderId}(orderId=${ob.id})}" title="Download File">
						          	<img th:src="@{/images/bootstrap-icons/download.svg}"/>
						        </a>
        					</td>				
							<td>
								<a class="nav-link" th:href="@{/home/job/view/{orderId}(orderId=${ob.id})}" title="View Record">
							      	<img th:src="@{/images/bootstrap-icons/folder2-open.svg}"/>
							    </a>
							</td>
        					<td>
        						<a class="nav-link" th:href="@{/home/job/edit/{orderId}(orderId=${ob.id})}" title="Edit Record">
						          	<img th:src="@{/images/bootstrap-icons/pencil-square.svg}"/>
						        </a>
        					</td>
        					<td>
		        				<a class="nav-link" th:href="@{/home/job/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
						          	<img th:src="@{/images/bootstrap-icons/trash-fill.svg}"/>
						        </a>
        					</td>
						</tr>
					</tbody>
				</table>
				<nav aria-label="Page navigation example" th:if="${totalPages > 0}">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/home/job/list}">First</a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/home/job/list/previous}">Previous</a></li>
						<li class="page-item"><a class="page-link" th:text="${currentPage + ' ... of ... ' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/home/job/list/next}">Next</a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/home/job/list/last}">Last</a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
