<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h4 class="h4 pb-3">Member (View Record)</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-success btn-sm" role="button" th:href="@{/home/member/list/current}" >
								<i class="bi bi-chevron-double-left"></i> To Member List
							</a>
						</div>
					</div>
				</div>

					
				<div class="row mb-2">
					<div class="col-sm-12 text-center">
						<img class="border rounded rounded-3" height="200px;" th:src="@{/home/profile/file/photo/{memId}(memId=${member.memId})}" alt="Profile Photo"/>
						<br/><span th:text="${member.memId}"></span>
						<br/><span th:text="${member.name}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.residenceAddress}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.residenceAddress}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.officeAddress}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.officeAddress}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.aadhaar}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.aadhaar}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.gender}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.gender.name}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.memType}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.memType.name}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.educationLevel}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.educationLevel.name}" th:if="${member.educationLevel!=null}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.memGroup}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.memGroup.name}" th:if="${member.memGroup!=null}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.caste}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.caste.name}" th:if="${member.caste!=null}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.tribe}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.tribe.name}" th:if="${member.tribe!=null}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.dateOfBirth}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${#dates.format(member.dateOfBirth, 'dd/MM/yyyy')}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.email}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.email}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.mobile}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.mobile}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.subStartDate}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${#dates.format(member.subStartDate, 'dd/MM/yyyy')}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.subEndDate}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${#dates.format(member.subEndDate, 'dd/MM/yyyy')}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.profilePublic}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.profilePublic}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.maritalStatus}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.maritalStatus.status}" th:if="${member.maritalStatus!=null}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.occupation}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.occupation.name}" th:if="${member.occupation!=null}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.roles}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:each="role : ${member.roles}" th:text="${role.code} + ' '"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.offDesignation}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.offDesignation}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.offName}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.offName}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.education}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:utext="${member.education}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{member.experience}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:utext="${member.experience}"></span>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>	
</html>
