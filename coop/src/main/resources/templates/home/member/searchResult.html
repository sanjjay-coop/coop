<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<h4 class="h4 pb-3">Member List</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-success btn-sm" role="button" th:href="@{/home/member/search}">
								<img th:src="@{/images/bootstrap-icons/search.svg}"/>&nbsp; Search Again</a>
						</div>
					</div>
				</div>
				
				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th class="col-sm-1" th:text="'S/N'"></th>
							<th th:text="#{member.name}"></th>
							<th class="col-sm-2" th:text="#{member.email}"></th>
							<th class="col-sm-1" th:text="#{member.mobile}"></th>
							<th class="col-sm-3" th:text="#{member.resAddress}"></th>
							<th style="width: 10px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listMember}">
        					<td th:text="${iterator.index + 1}"></td>
							<td th:text="${ob.name}"></td>
        					<td th:text="${ob.email}"></td>
        					<td th:text="${ob.mobile}"></td>
							<td th:text="${ob.residenceAddress}"></td>
							<td>
        						<a class="nav-link" th:href="@{/home/member/view/{orderId}(orderId=${ob.id})}" title="View Record">
						          	<i class="bi bi-folder2-open"></i>
						        </a>
        					</td>
						</tr>
					</tbody>
					
					<tfoot>
					</tfoot>
				</table>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
