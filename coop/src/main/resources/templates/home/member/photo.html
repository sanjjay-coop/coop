<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row">

			<div class="col-12">
			
				<h3 class="fw-bold">Profile (Update Photo)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<form th:action= "${servletRequest.requestURI}" th:object="${fileUploadForm}" method="POST" enctype="multipart/form-data">
				  	
				  	<input type="hidden" class="form-control" th:field="*{description}">

					<div class="row g-3">
						<div class="col-md-7">
				    		<label class="col-3 col-form-label" th:text="#{fileUploadForm.file}"></label>
				    		<input type="file" class="form-control" th:field="*{file}" th:placeholder="#{fileUploadForm.file}" autofocus >
				      		<ul><li class="cooperror" th:errors="*{file}" /></ul>
				    	</div>
						<div class="col-md-12">
				    		<button type="submit" class="btn btn-primary">Submit</button>
				    	</div>
				  	</div>
				</form>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
