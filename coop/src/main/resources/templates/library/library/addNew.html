<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row p-2">

			<div class="col-12">
			
				<h3 class="fw-bold">Library (Add New)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<form th:action= "${servletRequest.requestURI}" th:object="${library}" method="POST">

					<div class="row g-3">
						<div class="col-md-3">
							<label class="form-label text-primary" th:text="#{library.shortName}"></label>
					   		<input type="text" class="form-control required" th:field="*{shortName}" th:placeholder="#{library.shortName}" autofocus >
					    	<ul><li class="cooperror" th:errors="*{shortName}" /></ul>
					    </div>
						<div class="col-md-9">
				    		<label class="form-label text-primary" th:text="#{library.name}"></label>
				    		<input type="text" class="form-control required" th:field="*{name}" th:placeholder="#{library.name}" >
				      		<ul><li class="cooperror" th:errors="*{name}" /></ul>
				    	</div>
						<div class="col-md-6">
							<label class="form-label text-primary" th:text="#{library.address}"></label>
							<input type="text" class="form-control" th:field="*{address}" th:placeholder="#{library.address}" >
					  		<ul><li class="cooperror" th:errors="*{address}" /></ul>
						</div>
						<div class="col-md-4">
							<label class="form-label text-primary" th:text="#{library.city}"></label>
							<input type="text" class="form-control" th:field="*{city}" th:placeholder="#{library.city}" >
					  		<ul><li class="cooperror" th:errors="*{city}" /></ul>
						</div>
						<div class="col-md-2">
							<label class="form-label text-primary" th:text="#{library.pin}"></label>
							<input type="text" class="form-control" th:field="*{pin}" th:placeholder="#{library.pin}" >
					  		<ul><li class="cooperror" th:errors="*{pin}" /></ul>
						</div>
						<div class="col-md-6">
							<label class="form-label text-primary" th:text="#{library.state}"></label>
							<input type="text" class="form-control" th:field="*{state}" th:placeholder="#{library.state}" >
					  		<ul><li class="cooperror" th:errors="*{state}" /></ul>
						</div>
						<div class="col-md-6">
							<label class="form-label text-primary" th:text="#{library.country}"></label>
							<input type="text" class="form-control" th:field="*{country}" th:placeholder="#{library.country}" >
					  		<ul><li class="cooperror" th:errors="*{country}" /></ul>
						</div>
						<div class="col-md-4">
							<label class="form-label text-primary" th:text="#{library.mobile}"></label>
							<input type="text" class="form-control" th:field="*{mobile}" th:placeholder="#{library.mobile}" >
					  		<ul><li class="cooperror" th:errors="*{mobile}" /></ul>
						</div>
						<div class="col-md-4">
							<label class="form-label text-primary" th:text="#{library.phone}"></label>
							<input type="text" class="form-control" th:field="*{phone}" th:placeholder="#{library.phone}" >
					  		<ul><li class="cooperror" th:errors="*{phone}" /></ul>
						</div>
						<div class="col-md-4">
							<label class="form-label text-primary" th:text="#{library.email}"></label>
							<input type="text" class="form-control" th:field="*{email}" th:placeholder="#{library.email}" >
					  		<ul><li class="cooperror" th:errors="*{email}" /></ul>
						</div>
						<div class="col-md-12">
							<button type="submit" class="btn btn-primary">Submit</button>
				    	</div>
				  	</div>
				</form>

				<br/>

				<h3 class="fw-bold">Library (List All)</h3>

				<table class="table">

					<thead>
						<tr>
							<th th:text="#{id}"></th>
							<th th:text="#{library.shortName}"></th>
							<th th:text="#{library.name}"></th>
							<th th:text="#{library.email}"></th>
							<th th:text="#{library.address}"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob : ${listLibrary}">
							<td th:text="${ob.id}"></td>
							<td th:text="${ob.shortName}"></td>
							<td th:text="${ob.name}"></td>
							<td th:text="${ob.email}"></td>
							<td>
								<span th:text="#{library.address}"></span><span th:text="${' : ' + ob.address}"></span><br/>
								<span th:text="#{library.city}"></span><span th:text="${' : ' + ob.city}"></span><br/>
								<span th:text="#{library.pin}"></span><span th:text="${' : ' + ob.pin}"></span><br/>
								<span th:text="#{library.state}"></span><span th:text="${' : ' + ob.state}"></span><br/>
								<span th:text="#{library.country}"></span><span th:text="${' : ' + ob.country}"></span><br/>
								<span th:text="#{library.phone}"></span><span th:text="${' : ' + ob.phone}"></span><br/>
								<span th:text="#{library.mobile}"></span><span th:text="${' : ' + ob.mobile}"></span>
							</td>
							<td>
								<a class="nav-link" th:href="@{/library/library/edit/{orderId}(orderId=${ob.id})}">
						          	<img th:src="@{/images/bootstrap-icons/pencil-square.svg}" alt="Edit"/>
						        </a>
							</td>
							<td>
								<a class="nav-link" th:href="@{/library/library/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')">
						          	<img th:src="@{/images/bootstrap-icons/trash-fill.svg}" alt="Delete"/>
						        </a>
							</td>
						</tr>
					</tbody>
					
					<tfoot>
						
					</tfoot>
				</table>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
