<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
			
		<h4 class="h4 p-2">Change Password</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		
		<form class="p-2" th:action= "${servletRequest.requestURI}" th:object="${changePasswordForm}" method="POST">

			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{cpf.currentPassword}"></label>
		    	<div class="col-sm-4">
		    		<input type="password" class="form-control" th:field="*{currentPassword}" th:placeholder="#{cpf.currentPassword}" autofocus >
		      		<ul><li th:errors="*{currentPassword}" /></ul>
		    	</div>
		    </div>
		    
			<div class="row p-2">
		    	<label class="col-sm-2 col-form-label text-success" th:text="#{cpf.newPassword}"></label>
		    	<div class="col-sm-4">
		    		<input type="password" class="form-control" th:field="*{newPassword}" th:placeholder="#{cpf.newPassword}">
		      		<ul><li th:errors="*{newPassword}" /></ul>
		    	</div>
		    </div>
			<div class="row p-2">
		    	<label class="col-sm-2 col-form-label text-success" th:text="#{cpf.retypeNewPassword}"></label>
		    	<div class="col-sm-4">
		    		<input type="password" class="form-control" th:field="*{retypeNewPassword}" th:placeholder="#{cpf.retypeNewPassword}">
		      		<ul><li th:errors="*{retypeNewPassword}" /></ul>
		    	</div>
		    </div>
			<div class="row p-2">
				<div class="offset-sm-2 col-sm-2">
		    		<button type="submit" class="btn btn-success">Submit</button>
		    	</div>
		  	</div>
		</form>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
</body>
</html>
