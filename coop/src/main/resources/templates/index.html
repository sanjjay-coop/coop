<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<div class="row">
					<div class="col-md-4 p-2 border border-light rounded-0" style="max-height: 500px;">
						<div class="card h-100">
							<h5 class="card-header">News Feed</h5>
						  	<div class="card-body overflow-auto">
								<div class="text-center p-2 g-2 m-2 border border-light rounded-1" th:each="obj : ${listNewsFeedHome}">
									<div class="text-primary h5" >
										<a class="text-decoration-none" target="_blank" th:href="${obj.url}" th:text="${obj.title}"></a>
									</div>							
									<small class="text-secondary" th:utext="${obj.description}"></small>
								</div>
						  	</div>
						  	<div class="card-footer">
						  		<a class="btn btn-secondary btn-sm" role="button" th:href="@{/newsFeed/list}">News Feed Archive</a>
						  	</div>
						</div>
					</div>
					<div class="col-md-8 p-2 border border-light rounded-0">
						<div id="carouselExampleCaptions" class="carousel slide">
						  	<div class="carousel-indicators">
						    	<button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
						    	<button type="button" th:each="obj,iterator : ${listCarouselDisplay}" 
									data-bs-target="#carouselExampleCaptions" th:data-bs-slide-to="${iterator.index + 1}" 
									th:aria-label="Slide + ' ' + ${iterator.index + 2}"></button>
						  	</div>
						  	<div class="carousel-inner" th:if="${carouselActive} ne null">
						    	<div class="carousel-item active">
						      		<img th:src="@{/carousel/download/{orderId}(orderId=${carouselActive.id})}" class="d-block w-100" alt="...">
						      		<div class="carousel-caption d-none d-md-block">
						        		<h5 th:text="${carouselActive.title}"></h5>
						        		<p th:text="${carouselActive.description}"></p>
						      		</div>
						   	 	</div>
						    	<div class="carousel-item" th:each="obj : ${listCarouselDisplay}">
						      		<img th:src="@{/carousel/download/{orderId}(orderId=${obj.id})}" class="d-block w-100" alt="...">
						      		<div class="carousel-caption d-none d-md-block">
										<h5 th:text="${obj.title}"></h5>
										<p th:text="${obj.description}"></p>
						      		</div>
						    	</div>
						  	</div>
						  	<button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
						    	<span class="carousel-control-prev-icon" aria-hidden="true"></span>
						    	<span class="visually-hidden">Previous</span>
						  	</button>
						  	<button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
						    	<span class="carousel-control-next-icon" aria-hidden="true"></span>
						    	<span class="visually-hidden">Next</span>
						  	</button>
						</div>
					</div>
				</div>
				
				<div class="row p-2">
					<div class="col-md-2 p-2 rounded-0">
						<div class="card h-100">
							<h5 class="card-header">Articles</h5>
						  	<div class="card-body overflow-auto">
								<div class="text-center" th:text="${countArticle}"></div>
						  	</div>
						</div>
					</div>
					<div class="col-md-2 p-2 rounded-0">
						<div class="card h-100">
							<h5 class="card-header">Businesses</h5>
						  	<div class="card-body overflow-auto">
								<div class="text-center" th:text="${countBusiness}"></div>
						  	</div>
						</div>
					</div>
					<div class="col-md-2 p-2 rounded-0">
						<div class="card h-100">
							<h5 class="card-header">Jobs</h5>
						  	<div class="card-body overflow-auto">
								<div class="text-center" th:text="${countJob}"></div>
						  	</div>
						</div>
					</div>
					<div class="col-md-2 p-2 rounded-0">
						<div class="card h-100">
							<h5 class="card-header">Members</h5>
						  	<div class="card-body overflow-auto">
								<div class="text-center"  th:text="${countMember}"></div>
						  	</div>
						</div>
					</div>
					<div class="col-md-2 p-2 rounded-0">
						<div class="card h-100">
							<h5 class="card-header">Books, etc.</h5>
						  	<div class="card-body overflow-auto">
								<div class="text-center"  th:text="${countTitle}"></div>
						  	</div>
						</div>
					</div>
					<div class="col-md-2 p-2 rounded-0">
						<div class="card h-100">
							<h5 class="card-header">News Feeds</h5>
						  	<div class="card-body overflow-auto">
								<div class="text-center" th:text="${countNewsFeed}"></div>
						  	</div>
						</div>
					</div>
				</div>
				
				<div class="card p-2 mb-3" th:each="article : ${listArticle}">
					<h5 class="card-header" th:text="${article.title}"></h5>
				  	<div class="card-body">
						<p th:utext="${article.content}"></p>
						<div style="font-size: small;">
							<b>Categories: </b>
							<span th:each="cat : ${article.categories}" th:text="${cat.name + ', '}"></span>
							<b> Last Update: </b>
							<span th:text="${#dates.format(article.updateDate, 'dd/MM/yyyy')}"></span>
						</div>
				  	</div>
				</div>
				<a th:if="${countArticle > 5}" class="nav-link" th:href="@{/article/list}"><button type="submit" class="btn btn-primary" style="height: 30px; font-size: 12px;">More Articles</button></a>
			</div>
			
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
