<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
				
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
							  		
		<div class="row g-3 p-2">
			<div class="col-md-6 p-5 my-auto">
				<figure class="text-center my-auto">
					<blockquote class="blockquote">
				    	<p th:text="${loginQuotation != null} ? ${loginQuotation.quote}"></p>
				  	</blockquote>
				  	<figcaption class="blockquote-footer" th:text="${loginQuotation != null} ? ${loginQuotation.author}">
				  	</figcaption>
				</figure>
			</div>
			<div class="col-md-6">
				
				<div class="p-3 border rounded-2">
					<div class="h4 pb-3">Login Form</div>
					
					<div class="row p-2">
						<div class="col-12">
							<div class="d-grid gap-2 d-md-block">
								<a class="btn btn-success btn-sm" role="button" th:href="@{/login}">
									<i class="bi bi-chevron-double-left"></i> Login with Password</a>
								<a class="btn btn-success btn-sm" role="button" th:href="@{/join}">
									<i class="bi bi-folder2-open"></i> No account? Join for free.</a>
								<a class="btn btn-success btn-sm" role="button" th:href="@{/resetPassword}" sec:authorize="!isAuthenticated()">
									<i class="bi bi-key"></i> Forgot Password</a>
							</div>
						</div>
					</div>
					
					<form class="p-3" name="f" th:action="@{/login}" method="POST">
						
						<div class="row g-3">
							<div class="col-md-11">
						  		<label for="username" class="col-sm-3 col-form-label text-success">Email ID</label>
						    	<input type="text" readonly class="form-control required" id="username" name="username" th:value="${otpForm.emailMobile}" placeholder="Username" >
						    </div><div class="col-md-7"></div>
							<div class="col-md-11">
						    	<label for="password" class="col-sm-3 col-form-label text-success">Email OTP</label>
						    	<input type="text" class="form-control required" id="password" name="password" placeholder="Password">
						    </div><div class="col-md-7"></div>
							<div class="col-md-6">
						    	<button type="submit" class="btn btn-success" onclick="validate();">Sign-In</button>
						    </div>
						</div>
													
					</form>
				</div>							
			</div>
		</div>
	</div>
	
	<div class="col-12">
		
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
	<script type="text/javascript">
		function validate() {
		    if (document.f.username.value == "" && document.f.password.value == "") {
		        alert("Username and password are required");
		        document.f.username.focus();
		        return false;
		    }
		    if (document.f.username.value == "") {
		        alert("Username is required");
		        document.f.username.focus();
		        return false;
		    }
		    if (document.f.password.value == "") {
				alert("Password is required");
				document.f.password.focus();
		        return false;
		    }
		}
	</script>
	
</body>
</html>
