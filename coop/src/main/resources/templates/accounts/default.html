<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
				
		<h4 class="h4 p-2">Accounts Dashboard</h4>
				
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		<br/>
		<div class="row px-4 py-2">
			<div style="text-align: center;" class="col-2">
				<a class="nav-link" th:href="@{/accounts/income/listRecent}">
			   		<img width="25px" th:src="@{/images/list-recent.png}" alt="Last 50 Receipts"/>
				</a>
				Last 50 Receipts
			</div>
				
			<div style="text-align: center;" class="col-2">
				<a class="nav-link" th:href="@{/accounts/expenditure/listRecent}">
				   	<img width="25px" th:src="@{/images/list-recent.png}" alt="Last 50 Payments"/>
				</a>
				Last 50 Payments
			</div>

			<div style="text-align: center;" class="col-2">
				<a class="nav-link" th:href="@{/accounts/reports}">
				   	<img width="25px" th:src="@{/images/reports.png}" alt="Reports"/>
				</a>
				Reports
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">	</div>
</body>
</html>
