<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h4 class="h4 pb-3">Income (Last 50 Payments)</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
								
				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th class="col-sm-1" th:text="'S/N'"></th>
							<th class="col-sm-1" th:text="#{id}"></th>
							<th class="col-sm-1" th:text="#{income.transactionDate}"></th>
							<th class="col-sm-1" th:text="#{income.amount}"></th>
							<th th:text="#{income.narration}"></th>
							<th class="col-sm-2" th:text="#{income.receiptNumber}"></th>
							<th class="col-sm-2" th:text="#{income.receivedFrom}"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listIncome}">
        					<td th:text="${iterator.index + 1}"></td>
        					<td th:text="${ob.id}"></td>
							<td th:text="${#dates.format(ob.transactionDate, 'dd/MM/yyyy')}"></td>
							<td th:text="${ob.amount}"></td>
        					<td th:text="${ob.narration}"></td>
							<td th:text="${ob.receiptNumber}"></td>
							<td th:text="${ob.receivedFrom}"></td>
        					<td>
        						<a class="nav-link" th:href="@{/accounts/income/edit/{orderId}(orderId=${ob.id})}" title="Edit Record">
						          	<i class="bi bi-pencil-square"></i>
						        </a>
        					</td>
        					<td>
		        				<a class="nav-link" th:href="@{/accounts/income/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
						          	<i class="bi bi-trash-fill"></i>
						        </a>
        					</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
