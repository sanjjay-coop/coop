<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h4 class="h4 pb-3">Gallery (Add New)</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-success btn-sm" role="button" th:href="@{/moderator/gallery/list/current}"><i class="bi bi-chevron-double-left"></i> To List</a>
						</div>
					</div>
				</div>
				
				<form th:action= "${servletRequest.requestURI}" th:object="${gallery}" method="POST" enctype="multipart/form-data">

					<div class="row mb-3">
						<label class="col-sm-2 col-form-label text-success" th:text="#{gallery.title}"></label>
						<div class="col-sm-10">
							<input type="text" class="form-control required" th:field="*{title}" th:placeholder="#{gallery.title}" autofocus >
							<ul><li class="cooperror" th:errors="*{title}" /></ul>
						</div>
					</div>
					
					<div class="row mb-3">
						<label class="col-sm-2 col-form-label text-success" th:text="#{gallery.description}"></label>
						<div class="col-sm-10">
							<textarea class="form-control required" rows="5" th:field="*{description}" th:placeholder="#{gallery.description}"></textarea>
							<ul><li class="cooperror" th:errors="*{description}" /></ul>
						</div>
					</div>
					
					<div class="row mb-3">
						<label class="col-sm-2 col-form-label text-success" th:text="#{gallery.date}"></label>
						<div class="col-sm-4">
							<input type="date" class="form-control required" th:field="*{date}" th:placeholder="#{gallery.date}">
							<ul><li class="cooperror" th:errors="*{date}" /></ul>
						</div>
						<label class="col-sm-2 col-form-label text-success" th:text="#{gallery.file}"></label>
						<div class="col-sm-4">
							<input type="file" class="form-control required" th:field="*{file}" th:placeholder="#{gallery.file}">
							<ul><li class="cooperror" th:errors="*{file}" /></ul>
						</div>
					</div>
	
					<div class="row mb-3">
						<div class="offset-sm-2 col-sm-2">
							<button type="submit" class="btn btn-sm btn-success">Submit</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
	
	<script type="text/javascript">
		$(document).ready(function() {
			$('#description').summernote({height: 200});
		});
    </script>
</body>	
</html>
