<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h4 class="h4 pb-3">Sponsorship Application</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<div class="row pb-2">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-success btn-sm" role="button" th:href="@{/moderator/sponsorshipApplication/list/current}">
								<i class="bi bi-chevron-double-left"></i> To List</a>
						</div>
					</div>
				</div>
					
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorship.title}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:text="${sponsorshipApplication.sponsorship.title}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorship.description}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:utext="${sponsorshipApplication.sponsorship.description}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.name}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${sponsorshipApplication.name}"></span>
			    	</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.address}"></label>
					<div class="col-sm-2">
						<span class="form-control border-light" th:text="${sponsorshipApplication.address}"></span>
			    	</div>
			    </div>
			    
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.city}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${sponsorshipApplication.city}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.pin}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${sponsorshipApplication.pin}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.state}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${sponsorshipApplication.state}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.country}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${sponsorshipApplication.country}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.reasonsForApplication}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:text="${sponsorshipApplication.reasonsForApplication}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.educationAndExperience}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:text="${sponsorshipApplication.educationAndExperience}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.mobile}"></label>
					<div class="col-sm-2">
						<span class="form-control border-light" th:text="${sponsorshipApplication.mobile}"></span>
			    	</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.email}"></label>
					<div class="col-sm-2">
						<span class="form-control border-light" th:text="${sponsorshipApplication.email}"></span>
			    	</div>
					<label class="col-sm-2 col-form-label text-success" th:text="#{sponsorshipApplication.status}"></label>
					<div class="col-sm-2">
						<span class="form-control border-light" th:text="${sponsorshipApplication.status}"></span>
					</div>
			  	</div>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
