<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row p-2">

			<div class="col-12">
				
				<h3 class="fw-bold">Invitations</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
							
				<table class="table">
				
					<thead>
						<tr>
							<th th:text="#{invitation.email}"></th>
							<th th:text="#{invitation.name}"></th>
							<th th:text="#{invitation.date}"></th>
							<th>Email Date</th>
							<th th:text="#{member}"></th>
							<th th:text="#{invitation.status}"></th>
							<th></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob : ${listInvitation}">
							<td th:text="${ob.email}"></td>
							<td th:text="${ob.name}"></td>
							<td th:text="${#dates.format(ob.date, 'dd/MM/yyyy hh:mm:ss')}"></td>
							<td th:text="${#dates.format(ob.updateDate, 'dd/MM/yyyy hh:mm:ss')}"></td>
							<td th:text="${ob.member.name}"></td>
							<td th:text="${ob.status}"></td>
							<td>
								<a class="nav-link" th:href="@{/moderator/invitation/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
							      	<img th:src="@{/images/bootstrap-icons/trash-fill.svg}" alt="Delete"/>
							    </a>
							</td>
						</tr>
					</tbody>
				</table>
				<nav aria-label="Page navigation example">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/moderator/invitation/list}">First</a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/moderator/invitation/list/previous}">Previous</a></li>
						<li class="page-item"><a class="page-link" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/moderator/invitation/list/next}">Next</a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/moderator/invitation/list/last}">Last</a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
