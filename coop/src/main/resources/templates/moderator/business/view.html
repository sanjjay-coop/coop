<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
			
		<h4 class="h4 p-2">Business (Details)</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>

		<div class="row p-2">
			<div class="col-12">
				<div class="d-grid gap-2 d-md-block">
					<a class="btn btn-primary btn-sm" role="button" th:href="@{/moderator/business/list/current}">
						<i class="bi bi-chevron-double-left"></i> Back to List</a>
					<a class="btn btn-primary btn-sm" role="button" th:href="@{/moderator/business/disable/{orderId}(orderId=${business.id})}" onclick="return confirm('Are you sure?')" th:if="${business.enabled}">
						<i class="bi bi-x-circle"></i> Disable</a>
					<a class="btn btn-primary btn-sm" role="button" th:href="@{/moderator/business/enable/{orderId}(orderId=${business.id})}" onclick="return confirm('Are you sure?')" th:unless="${business.enabled}">
						<i class="bi bi-check-circle"></i> Enable</a>
					<a class="btn btn-primary btn-sm" role="button" th:href="@{/moderator/business/delete/{orderId}(orderId=${business.id})}" onclick="return confirm('Are you sure?')">
						<i class="bi bi-trash-fill"></i> Delete Record</a>
				</div>
			</div>
		</div>

		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.businessName}"></label>
	    	<div class="col-sm-10">
		    	<span class="form-control border-light" th:text="${business.businessName}"></span>
	    	</div>
	    </div>
	    
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.description}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.description}"></span>
			</div>
		</div>
		
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.address}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.address}"></span>
			</div>
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.city}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.city}"></span>
			</div>
		</div>
		
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.pin}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.pin}"></span>
			</div>
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.state}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.state}"></span>
			</div>
		</div>
		
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.country}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.country}"></span>
			</div>
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.contactName}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.contactName}"></span>
			</div>
		</div>
		
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.contactPhone}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.contactPhone}"></span>
			</div>
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.contactEmail}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.contactEmail}"></span>
			</div>
		</div>
		
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.url}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.url}"></span>
			</div>
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.keywords}"></label>
			<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.keywords}"></span>
			</div>
		</div>
		
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.enabled}"></label>
		   	<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.enabled}"></span>
		   	</div>
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.addDate}"></label>
		   	<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${#dates.format(business.addDate, 'dd/MM/yyyy')}"></span>
		   	</div>
		</div>
		
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary" th:text="#{business.owner}"></label>
		   	<div class="col-sm-4">
		    	<span class="form-control border-light" th:text="${business.owner.name}"></span>
		   	</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
</body>
</html>
