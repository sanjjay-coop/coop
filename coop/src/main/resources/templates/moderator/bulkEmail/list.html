<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">
			<div class="col-12">
				
				<h4 class="h4 pb-3">BulkEmail</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
			
				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/moderator/bulkEmail/addNew}">
								<img th:src="@{/images/bootstrap-icons/plus-circle.svg}"/>&nbsp; Add Message</a>
						</div>
					</div>
				</div>

				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th class="col-sm-1" th:text="'S/N'"></th>
							<th class="col-sm-2" th:text="#{bulkEmail.subject}"></th>
							<th class="col-sm-2" th:text="#{bulkEmail.bcc}"></th>
							<th th:text="#{bulkEmail.message}"></th>
							<th class="col-sm-1 text-center" th:text="#{bulkEmail.status}"></th>
							<th class="col-sm-2 text-center" th:text="#{bulkEmail.dateSent}"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listBulkEmail}">
							<td th:text="${20 * (currentPage - 1) + iterator.index + 1}"></td>	
        					<td th:text="${ob.subject}"></td>
        					<td th:text="${ob.bcc}"></td>
							<td th:utext="${ob.htmlString}"></td>		
							<td class="text-center" th:utext="${ob.status}"></td>	
							<td class="text-center" th:text="${#dates.format(ob.dateSent, 'dd/MM/yyyy hh:mm:ss')}"></td>
							<td>
								<a class="nav-link" th:href="@{/moderator/bulkEmail/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
							      	<img th:src="@{/images/bootstrap-icons/trash-fill.svg}"/>
							    </a>
							</td>
						</tr>
					</tbody>
					<tfoot></tfoot>
				</table>
				<nav aria-label="Page navigation example" th:if="${totalPages > 0}">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/moderator/bulkEmail/list}">First</a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/moderator/bulkEmail/list/previous}">Previous</a></li>
						<li class="page-item"><a class="page-link" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/moderator/bulkEmail/list/next}">Next</a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/moderator/bulkEmail/list/last}">Last</a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
