<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
			
		<h4 class="h4 p-2">Reset Password</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		
		<form class="p-2" th:action= "${servletRequest.requestURI}" th:object="${member}" method="POST">

			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{member.memId}"></label>
		    	<div class="col-sm-4">
					<input type="text" class="form-control required" th:field="*{memId}" th:placeholder="#{member.memId}">
			  		<ul><li class="cooperror" th:errors="*{memId}" /></ul>
		    	</div>
		    </div>

			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{member.email}"></label>
		    	<div class="col-sm-4">
					<input type="text" class="form-control required" th:field="*{email}" th:placeholder="#{member.email}">
			  		<ul><li class="cooperror" th:errors="*{email}" /></ul>
		    	</div>
		    </div>

			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{member.mobile}"></label>
		    	<div class="col-sm-4">
					<input type="text" class="form-control required" th:field="*{mobile}" th:placeholder="#{member.mobile}">
			  		<ul><li class="cooperror" th:errors="*{mobile}" /></ul>
		    	</div>
		    </div>
						    
			<div class="row p-2">
				<div class="offset-sm-2 col-sm-2">
					<button type="submit" class="btn btn-sm btn-success">Submit</button>
				</div>
			</div>	
		</form>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
</body>
</html>
