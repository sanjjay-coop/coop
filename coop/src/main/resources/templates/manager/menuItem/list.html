<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row p-2">

			<div class="col-12">
				
				<h3 class="fw-bold">Menu Item (List)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row p-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/menuItem/addNew}">Add New Menu Item</a>
						</div>
					</div>
				</div>
				
				<table class="table">
				
					<thead>
						<tr>
							<th th:text="#{id}"></th>
							<th th:text="#{menuItem.title}"></th>
							<th th:text="#{menuItem.location}"></th>
							<th th:text="#{menuItem.itemType}"></th>
							<th th:text="#{menuItem.category}"></th>
							<th th:text="#{menuItem.url}"></th>
							<th th:text="#{menuItem.newPage}"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob : ${listMenuItem}">
        					<td th:text="${ob.id}"></td>
        					<td th:text="${ob.title}"></td>
							<td th:text="${ob.location}"></td>
							<td th:text="${ob.itemType}"></td>
							<td th:text="${ob.category.name}"></td>
							<td th:text="${ob.url}"></td>
							<td th:text="${ob.newPage}"></td>
        					<td>
        						<a class="nav-link" th:href="@{/manager/menuItem/edit/{orderId}(orderId=${ob.id})}">
						          	<img th:src="@{/images/bootstrap-icons/pencil-square.svg}" alt="Update"/>
						        </a>
        					</td>
        					<td>
		        				<a class="nav-link" th:href="@{/manager/menuItem/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')">
						          	<img th:src="@{/images/bootstrap-icons/trash-fill.svg}" alt="Delete"/>
						        </a>
        					</td>
						</tr>
					</tbody>
				</table>
				<nav aria-label="Page navigation example">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/manager/menuItem/list}">First</a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/manager/menuItem/list/previous}">Previous</a></li>
						<li class="page-item"><a class="page-link" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/manager/menuItem/list/next}">Next</a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/manager/menuItem/list/last}">Last</a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
