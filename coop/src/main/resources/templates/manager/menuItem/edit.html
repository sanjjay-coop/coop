<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
			
		<h4 class="h4 p-2">Menu Item (Edit)</h4>

		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>

		<div class="row p-2">
			<div class="col-12">
				<div class="d-grid gap-2 d-md-block">
					<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/menuItem/list/current}">
						<i class="bi bi-chevron-double-left"></i> Back to List
					</a>
				</div>
			</div>
		</div>
		
		<form class="p-2" th:action= "${servletRequest.requestURI}" th:object="${menuItem}" method="POST">

			<input type="hidden" class="form-control" th:field="*{id}">

			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-primary" th:text="#{menuItem.title}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control bg-info-subtle" th:field="*{title}" th:placeholder="#{menuItem.title}" autofocus >
			  		<ul><li class="cooperror" th:errors="*{title}" /></ul>
				</div>
				<label class="col-sm-2 col-form-label text-primary" th:text="#{menuItem.location}"></label>
				<div class="col-sm-4">
		    		<select class="form-selectbg-info-subtle" th:field="*{location}">
						<option th:value="left" th:text="left" />
						<option th:value="top" th:text="top" />
					</select>
					<ul><li class="cooperror" th:errors="*{location}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-primary" th:text="#{menuItem.itemType}"></label>
				<div class="col-sm-4">
		    		<select class="form-selectbg-info-subtle" th:field="*{itemType}">
						<option th:value="category" th:text="Category" />
						<option th:value="url" th:text="URL" />
					</select>
					<ul><li class="cooperror" th:errors="*{itemType}" /></ul>
				</div>
				<label class="col-sm-2 col-form-label text-primary" th:text="#{menuItem.category}"></label>
				<div class="col-sm-4">
		    		<select class="form-select" th:field="*{category}">
						<option th:each="p : ${listCategory}" th:value="${p.id}" th:text="${p.name}" />
					</select>
					<ul><li class="cooperror" th:errors="*{category}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-primary" th:text="#{menuItem.url}"></label>
				<div class="col-sm-10">
		    		<input type="text" class="form-control" th:field="*{url}" th:placeholder="#{menuItem.url}" >
			  		<ul><li class="cooperror" th:errors="*{url}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-primary" th:text="#{menuItem.icon}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control" th:field="*{icon}" th:placeholder="#{menuItem.icon}" >
			  		<ul><li class="cooperror" th:errors="*{icon}" /></ul>
				</div>
				<label class="col-sm-2 col-form-label text-primary" th:text="#{menuItem.newPage}"></label>
				<div class="col-sm-4">
		    		<select class="form-select" th:field="*{newPage}">
						<option th:value="0" th:text="FALSE" />
						<option th:value="1" th:text="TRUE" />
					</select>
					<ul><li class="cooperror" th:errors="*{newPage}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<div class="offset-sm-2 col-sm-2">
					<button type="submit" class="btn btn-primary">Submit</button>
				</div>
			</div>
		</form>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
</body>
</html>
