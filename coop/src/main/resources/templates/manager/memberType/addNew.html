<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h4 class="h4 pb-3">Member Type (Add New)</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<form th:action= "${servletRequest.requestURI}" th:object="${memberType}" method="POST">

					<div class="row mb-2">
						<label class="col-sm-2 col-form-label text-success" th:text="#{memberType.name}"></label>
						<div class="col-sm-4">
				    		<input type="text" class="form-control required" th:field="*{name}" th:placeholder="#{memberType.name}" autofocus />
					  		<ul><li class="cooperror" th:errors="*{name}" /></ul>
						</div>
					</div>
					
					<div class="row mb-2">
						<div class="offset-sm-2 col-sm-2">
							<button type="submit" class="btn btn-success">Submit</button>
						</div>
					</div>
				</form>
				
				<br/>
				
				<h4 class="h4 pb-3">MemberType (List All)</h4>

				<div class="row px-4 py-2">
					<div class="col-6">
						<table class="table table-sm small table-bordered table-striped">
						
							<thead>
								<tr>
									<th class="col-sm-1" th:text="'S/N'"></th>
									<th th:text="#{memberType.name}"></th>
									<th style="width: 15px;"></th>
									<th style="width: 15px;"></th>
								</tr>
							</thead>
							
							<tbody>
								<tr th:each="ob,iterator : ${listMemberType}">
		        					<td th:text="${iterator.index + 1}"></td>
        							<td th:text="${ob.name}"></td>
		        					<td>
		        						<a class="nav-link" th:href="@{/manager/memberType/edit/{orderId}(orderId=${ob.id})}" title="Edit record">
								          	<i class="bi bi-vector-pen"></i>
								        </a>
		        					</td>
		        					<td>
				        				<a class="nav-link" th:href="@{/manager/memberType/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
								          	<i class="bi bi-trash-fill"></i>
								        </a>
		        					</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
