<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
				
		<h4 class="h4 p-2">Module</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>

		<div class="row p-2">
			<div class="col-12">
				<div class="d-grid gap-2 d-md-block">
					<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/module/addNew}">
						<i class="bi bi-plus-circle"></i> Add module</a>
				</div>
			</div>
		</div>
		
		<div class="row p-2">
			<div class="col-12">
				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th class="col-sm-1" th:text="'S/N'"></th>
							<th th:text="#{module.name}"></th>
							<th class="col-sm-2" th:text="#{module.enabled}"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listModule}">
	       					<td th:text="${20 * (currentPage - 1) + iterator.index + 1}"></td>
	       					<td th:text="${ob.name}"></td>
	       					<td th:text="${ob.enabled}"></td>
	       					<td>
	       						<a class="nav-link" th:href="@{/manager/module/update/{orderId}(orderId=${ob.id})}" title="Edit Record">
						          	<i class="bi bi-vector-pen"></i>
						        </a>
	       					</td>
	       					<td>
		        				<a class="nav-link" th:href="@{/manager/module/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record" >
						          	<i class="bi bi-trash-fill"></i>
						        </a>
	       					</td>
						</tr>
					</tbody>
				</table>
				<nav aria-label="Page Navigation" th:if="${totalPages > 0}">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link text-primary" th:href="@{/manager/module/list}"><i class="bi bi-chevron-bar-left"></i></a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link text-primary" th:href="@{/manager/module/list/previous}"><i class="bi bi-chevron-left"></i></a></li>
						<li class="page-item"><a class="page-link text-primary" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link text-primary" th:href="@{/manager/module/list/next}"><i class="bi bi-chevron-right"></i></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link text-primary" th:href="@{/manager/module/list/last}"><i class="bi bi-chevron-bar-right"></i></a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
</body>
</html>
