<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h4 class="h4 pb-3">Contact (Update)</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<form th:action= "${servletRequest.requestURI}" th:object="${contact}" method="POST">
				
					<input type="hidden" class="form-control" th:field="*{id}">

					<div class="row g-3">
						<div class="col-md-6">
				    		<label class="form-label text-primary" th:text="#{contact.name}"></label>
				    		<input type="text" class="form-control required" th:field="*{name}" th:placeholder="#{contact.name}" autofocus >
				      		<ul><li class="cooperror" th:errors="*{name}" /></ul>
				    	</div>
						<div class="col-md-6">
				    		<label class="form-label text-primary" th:text="#{contact.designation}"></label>
				    		<input type="text" class="form-control required" th:field="*{designation}" th:placeholder="#{contact.designation}">
				      		<ul><li class="cooperror" th:errors="*{designation}" /></ul>
				    	</div>
						<div class="col-md-12">
				    		<label class="form-label text-primary" th:text="#{contact.address}"></label>
				    		<input type="text" class="form-control required" th:field="*{address}" th:placeholder="#{contact.address}">
				      		<ul><li class="cooperror" th:errors="*{address}" /></ul>
				    	</div>
						<div class="col-md-6">
				    		<label class="form-label text-primary" th:text="#{contact.email}"></label>
				    		<input type="text" class="form-control required" th:field="*{email}" th:placeholder="#{contact.email}">
				      		<ul><li class="cooperror" th:errors="*{email}" /></ul>
				    	</div>
						<div class="col-md-6">
				    		<label class="form-label text-primary" th:text="#{contact.phone}"></label>
				    		<input type="text" class="form-control required" th:field="*{phone}" th:placeholder="#{contact.phone}">
				      		<ul><li class="cooperror" th:errors="*{phone}" /></ul>
				    	</div>
						<div class="col-md-12">
				      		<button type="submit" class="btn btn-primary">Submit</button>
				    	</div>
				  	</div>
				</form>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
