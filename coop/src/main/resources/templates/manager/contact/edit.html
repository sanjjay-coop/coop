<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
			
		<h4 class="h4 p-2">Contact (Update)</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		
		<div class="row p-2">
			<div class="col-12">
				<div class="d-grid gap-2 d-md-block">
					<a class="btn btn-success btn-sm" role="button" th:href="@{/manager/contact/addNew}">
						<i class="bi bi-chevron-double-left"></i> Back to List
					</a>
				</div>
			</div>
		</div>
		
		<form class="p-2" th:action= "${servletRequest.requestURI}" th:object="${contact}" method="POST">
		
			<input type="hidden" class="form-control" th:field="*{id}">

			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{contact.name}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control required" th:field="*{name}" th:placeholder="#{contact.name}" autofocus >
			  		<ul><li class="cooperror" th:errors="*{name}" /></ul>
				</div>
				<label class="col-sm-2 col-form-label text-success" th:text="#{contact.designation}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control required" th:field="*{designation}" th:placeholder="#{contact.designation}">
			  		<ul><li class="cooperror" th:errors="*{designation}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{contact.address}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control required" th:field="*{address}" th:placeholder="#{contact.address}">
			  		<ul><li class="cooperror" th:errors="*{address}" /></ul>
				</div>
				<label class="col-sm-2 col-form-label text-success" th:text="#{contact.email}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control required" th:field="*{email}" th:placeholder="#{contact.email}">
			  		<ul><li class="cooperror" th:errors="*{email}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{contact.phone}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control required" th:field="*{phone}" th:placeholder="#{contact.phone}">
			  		<ul><li class="cooperror" th:errors="*{phone}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{contact.about}"></label>
				<div class="col-sm-10">
		    		<textarea class="widgEditor form-control" rows="5" th:field="*{about}" th:placeholder="#{article.about}"></textarea>
					<ul><li class="cooperror" th:errors="*{about}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<div class="offset-sm-2 col-sm-2">
					<button type="submit" class="btn btn-success">Submit</button>
				</div>
			</div>
		</form>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
	<script type="text/javascript">
		$(document).ready(function() {
			$('#about').summernote({height: 200});
		});
    </script>
    
</body>
</html>
