<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h3 class="fw-bold pb-3">Article Category (Edit)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<form th:action= "${servletRequest.requestURI}" th:object="${category}" method="POST">
				
					<input type="hidden" class="form-control" th:field="*{id}">

					<div class="row g-3">
						<div class="col-md-6">
				    		<label class="form-label text-primary" th:text="#{category.name}"></label>
				    		<input type="text" class="form-control required" th:field="*{name}" th:placeholder="#{category.name}" autofocus />
				      		<ul><li class="cooperror" th:errors="*{name}" /></ul>
				    	</div>
						<div class="col-md-12">
				      		<button type="submit" class="btn btn-primary">Submit</button>
				    	</div>
				  	</div>
				</form>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
