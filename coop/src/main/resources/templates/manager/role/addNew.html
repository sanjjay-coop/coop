<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
			
		<h4 class="h4 p-2">Role (Add New)</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		
		<form class="p-2" th:action= "${servletRequest.requestURI}" th:object="${role}" method="POST">

			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-primary" th:text="#{role.code}"></label>
				<div class="col-sm-2">
		    		<input type="text" class="form-control bg-info-subtle" th:field="*{code}" th:placeholder="#{role.code}" autofocus >
			  		<ul><li class="cooperror" th:errors="*{code}" /></ul>
				</div>
				
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-primary" th:text="#{role.description}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control bg-info-subtle" th:field="*{description}" th:placeholder="#{role.description}" autofocus >
			  		<ul><li class="cooperror" th:errors="*{description}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<div class="offset-sm-2 col-sm-2">
					<button type="submit" class="btn btn-primary">Submit</button>
				</div>
			</div>
		</form>
		
		<br/>
		
		<h4 class="h4 p-2">Role (List All)</h4>
		
		<div class="row p-2">
			<div class="col-12">
				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th class="col-sm-1" th:text="'S/N'"></th>
							<th class="col-sm-3" th:text="#{role.code}"></th>
							<th th:text="#{role.description}"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listRole}">
        					<td th:text="${iterator.index + 1}"></td>
      							<td th:text="${ob.code}"></td>
							<td th:text="${ob.description}"></td>
        					<td>
        						<a class="nav-link" th:href="@{/manager/role/edit/{orderId}(orderId=${ob.id})}" title="Edit Record">
						          	<i class="bi bi-vector-pen"></i>
						        </a>
        					</td>
        					<td>
		        				<a class="nav-link" th:href="@{/manager/role/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
						          	<i class="bi bi-trash-fill"></i>
						        </a>
        					</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
</body>
</html>
