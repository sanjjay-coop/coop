<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
			
		<h4 class="h4 p-2">Profession (Add New)</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		
		<form class="p-2" th:action= "${servletRequest.requestURI}" th:object="${profession}" method="POST">

			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-primary" th:text="#{profession.name}"></label>
		    	<div class="col-sm-4">
		    		<input type="text" class="form-control" th:field="*{name}" th:placeholder="#{profession.name}" autofocus >
		      		<ul><li class="cooperror" th:errors="*{name}" /></ul>
		    	</div>
		    </div>
		    
			<div class="row p-2">
				<div class="offset-sm-2 col-sm-2">
					<button type="submit" class="btn btn-primary">Submit</button>
		    	</div>
		  	</div>
		</form>
		
		<h4 class="h4 p-2">Profession (List All)</h4>
		
		<div class="row p-2">
			<div class="col-12">
				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th th:text="#{profession.name}"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listProfession}">
	       					<td th:text="${ob.name}"></td>
	       					<td>
	       						<a class="nav-link" th:href="@{/manager/profession/edit/{orderId}(orderId=${ob.id})}" title="Edit Record">
						          	<i class="bi bi-vector-pen"></i>
						        </a>
	       					</td>
	       					<td>
		        				<a class="nav-link" th:href="@{/manager/profession/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
						          	<i class="bi bi-trash-fill"></i>
						        </a>
	       					</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
</body>
</html>
