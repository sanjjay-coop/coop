<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
			
		<h4 class="h4 p-2">Event (Add New)</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		
		<div class="row p-2">
			<div class="col-12">
				<div class="d-grid gap-2 d-md-block">
					<a class="btn btn-success btn-sm" role="button" th:href="@{/manager/event/list/current}">
						<i class="bi bi-chevron-double-left"></i> To Event List</a>
				</div>
			</div>
		</div>
		
		<form class="p-2" th:action= "${servletRequest.requestURI}" th:object="${event}" method="POST">

			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{event.title}"></label>
				<div class="col-sm-10">
		    		<input type="text" class="form-control required" th:field="*{title}" th:placeholder="#{event.title}" autofocus >
			  		<ul><li class="cooperror" th:errors="*{title}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{event.description}"></label>
				<div class="col-sm-10">
		    			<textarea class="widgEditor form-control" rows="5" th:field="*{description}" th:placeholder="#{event.description}"></textarea>
			  		<ul><li class="cooperror" th:errors="*{description}" /></ul>
				</div>
			</div>
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{event.startDate}"></label>
				<div class="col-sm-4">
		    		<input type="date" class="form-control required" th:field="*{startDate}" th:placeholder="#{event.startDate}">
			  		<ul><li class="cooperror" th:errors="*{startDate}" /></ul>
				</div>
				<label class="col-sm-2 col-form-label text-success" th:text="#{event.endDate}"></label>
				<div class="col-sm-4">
		    		<input type="date" class="form-control required" th:field="*{endDate}" th:placeholder="#{event.endDate}">
			  		<ul><li class="cooperror" th:errors="*{endDate}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{event.venue}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control" th:field="*{venue}" th:placeholder="#{event.venue}">
			  		<ul><li class="cooperror" th:errors="*{venue}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{event.city}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control" th:field="*{city}" th:placeholder="#{event.city}">
			  		<ul><li class="cooperror" th:errors="*{city}" /></ul>
				</div>
				<label class="col-sm-2 col-form-label text-success" th:text="#{event.state}"></label>
				<div class="col-sm-4">
		    		<input type="text" class="form-control" th:field="*{state}" th:placeholder="#{event.state}">
			  		<ul><li class="cooperror" th:errors="*{state}" /></ul>
				</div>
			</div>
			
			<div class="row p-2">
				<label class="col-sm-2 col-form-label text-success" th:text="#{event.publish}"></label>
				<div class="col-sm-4">
		    		<select class="form-select" th:field="*{publish}">
						<option th:each="p : ${listYesNo}" th:value="${p.value}" th:text="${p.label}" />
					</select>
					<ul><li class="cooperror" th:errors="*{publish}" /></ul>
				</div>
				<label class="col-sm-2 col-form-label text-success" th:text="#{event.eventType}"></label>
				<div class="col-sm-4">
		    		<select class="form-select" th:field="*{eventType}">
						<option th:each="p : ${listEventType}" th:value="${p.id}" th:text="${p.name}" />
					</select>
					<ul><li class="cooperror" th:errors="*{eventType}" /></ul>
				</div>
			</div>
			<div class="row p-2">
				<div class="offset-sm-2 col-sm-2">
					<button type="submit" class="btn btn-success">Submit</button>
				</div>
			</div>
		</form>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
	<script type="text/javascript">
		$(document).ready(function() {
			$('#description').summernote({height: 200});
		});
    </script>
    
</body>	
</html>
