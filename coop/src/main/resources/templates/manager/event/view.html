<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row px-4 py-2">

			<div class="col-12">
				<h3 class="fw-bold pb-3">Event (Details)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/event/list/current}">To Event List</a>
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/event/edit/{orderId}(orderId=${event.id})}">Edit Event</a>
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/eventUpdate/addNew/{orderId}(orderId=${event.id})}">Add Update</a>
						</div>
					</div>
				</div>
								
				<div>
					<h3 class="bg-light" th:text="${event.title}"></h3>
					<pre th:utext="${event.description}" style="text-wrap: wrap;"></pre>
					<div style="font-size: small;">
						<b>Event Type: </b>
						<span th:text="${event.eventType.name}"></span>
						<b> Start Date: </b>
						<span th:text="${#dates.format(event.startDate, 'dd/MM/yyyy')}"></span>
						<b> End Date: </b>
						<span th:text="${#dates.format(event.endDate, 'dd/MM/yyyy')}"></span>
					</div>
				</div>
				<div th:each="eventUpdate : ${event.updates}" style="margin: 10px; padding: 10px; border:aliceblue solid 1px; border-radius: 10px;">
					<span th:utext="${eventUpdate.description}" style="text-wrap: wrap;"></span>
					<br/><span style="font-weight: bold; font-size: small;">Last Update: </span>
					<span style="font-size: small;" th:text="${#dates.format(eventUpdate.updateDate, 'dd/MM/yyyy HH:mm:ss')}"></span><br/>
					<a class="nav-link" th:href="@{/manager/eventUpdate/delete/{orderId}(orderId=${eventUpdate.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
						<img th:src="@{/images/bootstrap-icons/trash-fill.svg}" alt="Delete Update"/>
					</a>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
