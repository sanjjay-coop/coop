<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h4 class="h4 pb-3">Event (Edit)</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/event/list/current}">
								<img th:src="@{/images/bootstrap-icons/arrow-left-circle.svg}"/>&nbsp; To Event List</a>
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/event/view/{orderId}(orderId=${event.id})}">
								<img th:src="@{/images/bootstrap-icons/folder2-open.svg}"/>&nbsp; View Event</a>
						</div>
					</div>
				</div>
				<form th:action= "${servletRequest.requestURI}" th:object="${event}" method="POST">
				
					<input type="hidden" class="form-control" th:field="*{id}">

					<div class="row mb-2">
						<label class="col-sm-2 col-form-label text-primary" th:text="#{event.title}"></label>
						<div class="col-sm-10">
				    		<input type="text" class="form-control required" th:field="*{title}" th:placeholder="#{event.title}" autofocus >
					  		<ul><li class="cooperror" th:errors="*{title}" /></ul>
						</div>
					</div>
					
					<div class="row mb-2">
						<label class="col-sm-2 col-form-label text-primary" th:text="#{event.description}"></label>
						<div class="col-sm-10">
				    			<textarea class="widgEditor form-control" rows="5" th:field="*{description}" th:placeholder="#{event.description}"></textarea>
					  		<ul><li class="cooperror" th:errors="*{description}" /></ul>
						</div>
					</div>
					<div class="row mb-2">
						<label class="col-sm-2 col-form-label text-primary" th:text="#{event.startDate}"></label>
						<div class="col-sm-4">
				    		<input type="date" class="form-control required" th:field="*{startDate}" th:placeholder="#{event.startDate}">
					  		<ul><li class="cooperror" th:errors="*{startDate}" /></ul>
						</div>
						<label class="col-sm-2 col-form-label text-primary" th:text="#{event.endDate}"></label>
						<div class="col-sm-4">
				    		<input type="date" class="form-control required" th:field="*{endDate}" th:placeholder="#{event.endDate}">
					  		<ul><li class="cooperror" th:errors="*{endDate}" /></ul>
						</div>
					</div>
					
					<div class="row mb-2">
						<label class="col-sm-2 col-form-label text-primary" th:text="#{event.publish}"></label>
						<div class="col-sm-4">
				    		<select class="form-select" th:field="*{publish}">
								<option th:each="p : ${listYesNo}" th:value="${p.value}" th:text="${p.label}" />
							</select>
							<ul><li class="cooperror" th:errors="*{publish}" /></ul>
						</div>
						<label class="col-sm-2 col-form-label text-primary" th:text="#{event.eventType}"></label>
						<div class="col-sm-4">
				    		<select class="form-select" th:field="*{eventType}">
								<option th:each="p : ${listEventType}" th:value="${p.id}" th:text="${p.name}" />
							</select>
							<ul><li class="cooperror" th:errors="*{eventType}" /></ul>
						</div>
					</div>
					<div class="row mb-2">
						<div class="offset-sm-2">
							<button type="submit" class="btn btn-primary">Submit</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
	
	<script type="text/javascript">
		$(document).ready(function() {
			$('#description').summernote({height: 200});
		});
    </script>
</body>	
</html>
