<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row px-4 py-2">

			<div class="col-12">
				
				<h3 class="fw-bold pb-3">Events</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/event/addNew}">Add New Event</a>
						</div>
					</div>
				</div>
				
				<table class="table table-sm table-bordered table-striped">
				
					<thead>
						<tr>
							<th th:text="#{id}"></th>
							<th th:text="#{event.title}"></th>
							<th th:text="#{event.publish}"></th>
							<th th:text="#{event.startDate}"></th>
							<th th:text="#{event.endDate}"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
							<th style="width: 15px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob : ${listEvent}">
        					<td th:text="${ob.id}"></td>
        					<td th:text="${ob.title}"></td>
							<td th:text="${ob.publish}"></td>
        					<td th:text="${#dates.format(ob.startDate, 'dd/MM/yyyy')}"></td>
        					<td th:text="${#dates.format(ob.endDate, 'dd/MM/yyyy')}"></td>
							<td>
								<a class="nav-link" th:href="@{/manager/event/view/{orderId}(orderId=${ob.id})}" title="View Record">
							      	<img th:src="@{/images/bootstrap-icons/folder2-open.svg}"/>
							    </a>
							</td>
        					<td>
        						<a class="nav-link" th:href="@{/manager/event/edit/{orderId}(orderId=${ob.id})}" title="Edit Record">
						          	<img th:src="@{/images/bootstrap-icons/pencil-square.svg}"/>
						        </a>
        					</td>
        					<td>
		        				<a class="nav-link" th:href="@{/manager/event/delete/{orderId}(orderId=${ob.id})}" onclick="return confirm('Are you sure?')" title="Delete Record">
						          	<img th:src="@{/images/bootstrap-icons/trash-fill.svg}"/>
						        </a>
        					</td>
						</tr>
					</tbody>
				</table>
				<nav aria-label="Page navigation example" th:if="${totalPages > 0}">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/manager/event/list}">First</a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/manager/event/list/previous}">Previous</a></li>
						<li class="page-item"><a class="page-link" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/manager/event/list/next}">Next</a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/manager/event/list/last}">Last</a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
