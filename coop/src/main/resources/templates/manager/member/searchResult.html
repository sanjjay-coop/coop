<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>
	
	<div class="container-fluid">
				
		<h4 class="h4 p-2">Member (Search result)</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		
		<div class="row p-2">
			<div class="col-12">
				<table class="table table-sm small table-bordered table-striped">
				
					<thead>
						<tr>
							<th class="col-sm-1" th:text="'S/N'"></th>
							<th class="col-sm-1" th:text="#{member.memId}"></th>
							<th th:text="#{member.name}"></th>
							<th class="col-sm-2" th:text="#{member.email}"></th>
							<th class="col-sm-1" th:text="#{member.mobile}"></th>
							<th style="width: 10px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob,iterator : ${listMember}">
							<td th:text="${iterator.index + 1}"></td>
	       					<td th:text="${ob.memId}"></td>
							<td th:text="${ob.name}"></td>
	       					<td th:text="${ob.email}"></td>
	       					<td th:text="${ob.mobile}"></td>
							<td>
	       						<a class="nav-link" th:href="@{/manager/member/view/{orderId}(orderId=${ob.id})}" title="View Record">
						          	<i class="bi bi-folder2-open"></i>
						        </a>
	       					</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}"></div>
	
</body>
</html>
