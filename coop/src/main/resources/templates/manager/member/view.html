<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h4 class="h4 pb-3">Member (View Record)</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/member/list/current}" >
								<img th:src="@{/images/bootstrap-icons/arrow-left-circle.svg}"/>&nbsp; To Member List
							</a>
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/member/edit/{orderId}(orderId=${member.id})}">
								<img th:src="@{/images/bootstrap-icons/pen.svg}"/>&nbsp; Edit Member
							</a>
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/member/delete/{orderId}(orderId=${member.id})}" onclick="return confirm('Are you sure?')">
								<img th:src="@{/images/bootstrap-icons/trash.svg}"/>&nbsp; Delete Member
							</a>
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/member/changePassword/{orderId}(orderId=${member.id})}">Change Password</a>
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/receipt/addNew/{orderId}(orderId=${member.id})}">
								<img th:src="@{/images/bootstrap-icons/plus-circle.svg}"/>&nbsp; Add Receipt</a>
						</div>
					</div>
				</div>

				<div class="row mb-2">
					<div class="col-sm-3">
						<img class="border rounded rounded-3" height="125px;" th:src="@{/home/profile/file/photo/{memId}(memId=${member.memId})}" alt="Profile Photo"/>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.memId}"></label>
				    <div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.memId}"></span>
				    </div>
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.name}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.name}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.residenceAddress}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:text="${member.residenceAddress}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.officeAddress}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:text="${member.officeAddress}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.aadhaar}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.aadhaar}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.gender}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.gender.name}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.memType}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.memType.name}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.educationLevel}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.educationLevel.name}" th:if="${member.educationLevel!=null}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.memGroup}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:if="${member.memGroup}" th:text="${member.memGroup.label}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.dateOfBirth}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${#dates.format(member.dateOfBirth, 'dd/MM/yyyy')}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.mobile}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.mobile}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.email}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.email}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.subStartDate}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${#dates.format(member.subStartDate, 'dd/MM/yyyy')}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.subEndDate}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${#dates.format(member.subEndDate, 'dd/MM/yyyy')}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.profilePublic}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.profilePublic}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.maritalStatus}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.maritalStatus.status}" th:if="${member.maritalStatus!=null}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.occupation}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.occupation.name}" th:if="${member.occupation!=null}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.roles}"></label>
					<div class="col-sm-4">
						<div class="form-control" th:each="role : ${member.roles}">
							<div th:text="${role.code}"></div>
						</div>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.offDesignation}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.offDesignation}"></span>
					</div>
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.offName}"></label>
					<div class="col-sm-4">
						<span class="form-control border-light" th:text="${member.offName}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.education}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:utext="${member.education}"></span>
					</div>
				</div>
				
				<div class="row mb-2">
					<label class="col-sm-2 col-form-label text-primary" th:text="#{member.experience}"></label>
					<div class="col-sm-10">
						<span class="form-control border-light" th:utext="${member.experience}"></span>
					</div>
				</div>
				 
				<br/>
				 	
				<h4 class="h4 pb-3" th:if="${member.receipts!=null and !member.receipts.isEmpty()}">Member (Receipts)</h4>
				
				<table class="table" th:if="${member.receipts!=null and !member.receipts.isEmpty()}">
								
					<thead>
						<tr>
							<th th:text="#{id}"></th>
							<th th:text="#{receipt.receiptDate}"></th>
							<th th:text="#{receipt.receiptNumber}"></th>
							<th th:text="#{receipt.details}"></th>
							<th th:text="#{receipt.amount}" style="text-align: right;"></th>
							<th width="40px;" th:text="#{receipt.document}"></th>
							<th width="15px;"></th>
						</tr>
					</thead>
									
					<tbody>
						<tr th:each="ob,iterator : ${member.receipts}">
	       					<td th:text="${ob.id}"></td>
							<td th:text="${#dates.format(ob.receiptDate, 'dd/MM/yyyy')}"></td>
							<td th:text="${ob.receiptNumber}"></td>
	       					<td th:text="${ob.details}"></td>
							<td th:text="${ob.amount}" style="text-align: right;"></td>
							<td>
								<a class="nav-link" th:href="@{/manager/payment/receipt/{orderId}(orderId=${ob.id})}">
							      	<img th:src="@{/images/bootstrap-icons/image.svg}"/>
							    </a>
							</td>
							<td>
								<a class="nav-link" th:href="@{/manager/member/{memId}/receipt/delete/{orderId}(orderId=${ob.id}, memId=${member.id})}" onclick="return confirm('Are you sure?')" title="Delete Receipt">
							      	<img th:src="@{/images/bootstrap-icons/trash-fill.svg}"/>
							    </a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>	
</html>
