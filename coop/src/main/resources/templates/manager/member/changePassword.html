<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container-fluid px-5">
		<div class="row px-4 py-2">

			<div class="col-12">
			
				<h4 class="h4 pb-3">Reset Password</h4>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
				<div class="row pb-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/member/list/current}" >
								<img th:src="@{/images/bootstrap-icons/arrow-left-circle.svg}"/>&nbsp; To Member List
							</a>
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/member/view/{orderId}(orderId=${member.id})}">
								<img th:src="@{/images/bootstrap-icons/folder2-open.svg}"/>&nbsp; View Member
							</a>
						</div>
					</div>
				</div>
				<form th:action= "${servletRequest.requestURI}" th:object="${member}" method="POST">
				
					<input type="hidden" class="form-control" th:field="*{id}">
					<input type="hidden" class="form-control" th:field="*{memId}">
					<input type="hidden" class="form-control" th:field="*{salutation}">
					<input type="hidden" class="form-control" th:field="*{firstName}">
					<input type="hidden" class="form-control" th:field="*{middleName}">
					<input type="hidden" class="form-control" th:field="*{lastName}">

					<div class="row mb-2">
						<label class="col-sm-2 col-form-label text-primary" th:text="#{member.memId}"></label>
					   	<div class="col-sm-4">
				    		<span class="form-control border-light" th:text="${member.memId}"></span>
					    </div>
					</div>
					
					<div class="row mb-2">
						<label class="col-sm-2 col-form-label text-primary" th:text="#{member.name}"></label>
						<div class="col-sm-4">
				    		<span class="form-control border-light" th:text="${member.name}"></span>
						</div>
					</div>
					
					<div class="row mb-2">
						<label class="col-sm-2 col-form-label text-primary" th:text="#{member.password}"></label>
						<div class="col-sm-4">
				    		<input type="password" class="form-control required" th:field="*{retypePassword}" th:placeholder="#{member.password}" autofocus>
					  		<ul><li class="cooperror" th:errors="*{retypePassword}" /></ul>
						</div>
					</div>
					
					<div class="row mb-2">
						<div class="offset-sm-2">
							<button type="submit" class="btn btn-primary">Submit</button>
				    	</div>
				  	</div>
				</form>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
