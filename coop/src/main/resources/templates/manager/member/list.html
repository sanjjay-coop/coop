<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{fragments :: header}">
		
	</div>
	
	<div class="container">
		<div class="row p-2">

			<div class="col-12">
				
				<h3 class="fw-bold">Member (List All)</h3>
				
				<div class="alert alert-warning" role="alert" th:text="${message}" th:if="${message != null }"></div>

				<div class="row p-3">
					<div class="col-12">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-primary btn-sm" role="button" th:href="@{/manager/member/addNew}">Add New Member</a>
						</div>
					</div>
				</div>
				
				<table class="table">
				
					<thead>
						<tr>
							<th th:text="#{member.memId}"></th>
							<th th:text="#{member.name}"></th>
							<th th:text="#{member.email}"></th>
							<th th:text="#{member.mobile}"></th>
							<th style="width: 10px;"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="ob : ${listMember}">
							<td th:text="${ob.memId}"></td>
							<td th:text="${ob.name}"></td>
        					<td th:text="${ob.email}"></td>
        					<td th:text="${ob.mobile}"></td>
							<td>
        						<a class="nav-link" th:href="@{/manager/member/view/{orderId}(orderId=${ob.id})}">
						          	<img th:src="@{/images/bootstrap-icons/folder2-open.svg}" alt="View Record"/>
						        </a>
        					</td>
						</tr>
					</tbody>
				</table>
				<nav aria-label="Page navigation example">
					<ul class="pagination">
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/manager/member/list}">First</a></li>
						<li class="page-item" th:if="${!firstPage}"><a class="page-link" th:href="@{/manager/member/list/previous}">Previous</a></li>
						<li class="page-item"><a class="page-link" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/manager/member/list/next}">Next</a></li>
						<li class="page-item" th:if="${!lastPage}"><a class="page-link" th:href="@{/manager/member/list/last}">Last</a></li>
					</ul>
				</nav>
			</div>
		</div>
	</div>
	
	<div class="container" th:replace="~{fragments :: footer}">
	</div>
</body>
</html>
