<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mobile/fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{mobile/fragments :: header}">
		
	</div>
	
	<div class="container-fluid">
	
		<h4 class="h4 p-2">Title (Search Result)</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
		<form class="row g-3 align-items-center p-2"  th:action= "${servletRequest.requestURI}" th:object="${title}" method="POST">
		  	<div class="col-auto">
		    	<div class="input-group">
		      		<div class="input-group-text">Search String</div>
			    	<input type="text" class="form-control" th:field="*{searchFor}" placeholder="Search for...">
			    	<button type="submit" class="btn btn-sm btn-secondary">Submit</button>
		    	</div>
		  	</div>
			
		</form>
				
		<div class="h6 p-2" th:text="'Total Records: ' + ${totalRecords}"></div>
		
		<div class="row p-2">
			<div class="col-12 p-2 border border-light rounded-0" th:each="title,iterator : ${listTitle}">
				<div class="card h-100">
					<h6 class="card-header bg-primary-subtle bg-gradient " 
						th:text="'Acc. No.: ' + ${title.accessionNumber} + ' [' + ${title.titleType.name} + ']'">News Feed</h6>
				  	<div class="card-body overflow-auto">
						
						<div class="row p-2">
							<label class="col-sm-2 col-form-label text-primary" th:text="#{title.uniformTitle}"></label>
							<div class="col-sm-10">
								<span class="form-control border-light" th:text="${title.uniformTitle}"></span>
							</div>
						</div>
						
						<div class="row p-2">
							<label class="col-sm-2 col-form-label text-primary" th:text="#{title.authors}"></label>
							<div class="col-sm-10">
								<span class="form-control border-light" th:text="${title.authors}"></span>
							</div>
						</div>
						
						<div class="row p-2">
							<label class="col-sm-2 col-form-label text-primary" th:text="#{title.library}"></label>
							<div class="col-sm-4">
								<span class="form-control border-light" th:text="${title.library.name + ' [' + title.library.shortName + ']'}"></span>
							</div>
						</div>
						
						<div class="row p-2">
							<label class="col-sm-2 col-form-label text-primary" th:text="#{title.summary}"></label>
							<div class="col-sm-10">
								<span class="form-control border-light" th:utext="${title.summary}"></span>
							</div>
						</div>
						
						<div class="row mb-2" th:if="${co}">
							<label class="col-sm-2 col-form-label text-primary" th:text="#{checkOut}"></label>
							<div class="col-sm-2">
								<span class="form-control border-light" th:text="${co.member.name + ' [' + co.member.memId + ']' }"></span>
							</div>
							<label class="col-sm-2 col-form-label text-primary">Issue Date</label>
							<div class="col-sm-2">
								<span class="form-control border-light" th:text="${#dates.format(co.transactionDate, 'dd/MM/yyyy')}"></span>
							</div>
							<label class="col-sm-2 col-form-label text-primary">Due Date</label>
							<div class="col-sm-2">
								<span class="form-control border-light" th:text="${#dates.format(co.dueDate, 'dd/MM/yyyy')}"></span>
							</div>
						</div>
				  	</div>
				</div>				
			</div>
		</div>
		
		<nav class="p-2" aria-label="Page Navigation" th:if="${totalPages > 0}">
			<ul class="pagination">
				<li class="page-item" th:if="${!firstPage}"><a class="page-link text-primary" th:href="@{/mobile/home/title/list}"><i class="bi bi-chevron-bar-left"></i></a></li>
				<li class="page-item" th:if="${!firstPage}"><a class="page-link text-primary" th:href="@{/mobile/home/title/list/previous}"><i class="bi bi-chevron-left"></i></a></li>
				<li class="page-item"><a class="page-link text-primary" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
				<li class="page-item" th:if="${!lastPage}"><a class="page-link text-primary" th:href="@{/mobile/home/title/list/next}"><i class="bi bi-chevron-right"></i></a></li>
				<li class="page-item" th:if="${!lastPage}"><a class="page-link text-primary" th:href="@{/mobile/home/title/list/last}"><i class="bi bi-chevron-bar-right"></i></a></li>
			</ul>
		</nav>
	</div>
	
	<div class="container" th:replace="~{mobile/fragments :: footer}">
	</div>
</body>
</html>
