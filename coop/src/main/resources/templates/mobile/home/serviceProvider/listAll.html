<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mobile/fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{mobile/fragments :: header}">
		
	</div>
	
	<div class="container-fluid">
	
		<h4 class="h4 p-2">Service Provider</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
				
		<form class="row g-3 align-items-center p-2"  th:action= "${servletRequest.requestURI}" th:object="${serviceProvider}" method="POST">
		  	<div class="col-auto">
		    	<div class="input-group">
		      		<div class="input-group-text">Search String</div>
			    	<input type="text" class="form-control" th:field="*{searchFor}" placeholder="Search for...">
			    	<button type="submit" class="btn btn-sm btn-secondary">Submit</button>
		    	</div>
		  	</div>
			
		</form>
				
		<div class="h6 p-2" th:text="'Total Records: ' + ${totalRecords}"></div>
		
		<div class="row p-2">
			<div class="col-md-12 border border-light rounded-0" th:each="ob,iterator : ${listServiceProviderAll}">
				<div class="card">
					<h5 class="card-header bg-success-subtle bg-gradient" th:text="${ob.serviceName}"></h5>
				  	<div class="card-body">
				  		<div class="small" th:text="${ob.description}"></div>
				  		<br/><i class="bi bi-house text-primary"></i>: <span class="small" th:text="${ob.address} + ', ' + ${ob.city} + ', ' + ${ob.pin} + ', ' + ${ob.state} + ', ' + ${ob.country}"></span>
				  		<br/><i class="bi bi-person text-primary"></i>: <span class="small" th:text="${ob.contactName} + ', ' + ${ob.contactPhone} + ', ' + ${ob.contactEmail}"></span>
				  		<br/><i class="bi bi-tags text-primary"></i>: <span class="small" th:text="${ob.keywords}"></span>
				  	</div>
				</div>		
			</div>
		</div>
		
		<nav class="p-2" aria-label="Page Navigation" th:if="${totalPages > 0}">
			<ul class="pagination">
				<li class="page-item" th:if="${!firstPage}"><a class="page-link text-success" th:href="@{/mobile/home/serviceProvider/list}"><i class="bi bi-chevron-bar-left"></i></a></li>
				<li class="page-item" th:if="${!firstPage}"><a class="page-link text-success" th:href="@{/mobile/home/serviceProvider/list/previous}"><i class="bi bi-chevron-left"></i></a></li>
				<li class="page-item"><a class="page-link text-success" th:text="${currentPage + '... of ...' + totalPages}"></a></li>
				<li class="page-item" th:if="${!lastPage}"><a class="page-link text-success" th:href="@{/mobile/home/serviceProvider/list/next}"><i class="bi bi-chevron-right"></i></a></li>
				<li class="page-item" th:if="${!lastPage}"><a class="page-link text-success" th:href="@{/mobile/home/serviceProvider/list/last}"><i class="bi bi-chevron-bar-right"></i></a></li>
			</ul>
		</nav>
	</div>
	
	<div class="container" th:replace="~{mobile/fragments :: footer}">
	</div>
</body>
</html>
