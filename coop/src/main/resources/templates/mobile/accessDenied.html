<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mobile/fragments :: html_head}">
</head>
<body>
	<div class="container text-center" th:replace="~{mobile/fragments :: header}">
		
	</div>
	
	<div class="container-fluid">
			
		<h4 class="h4 p-2">Access denied!</h4>
		
		<div class="alert alert-warning p-2" role="alert" th:text="${message}" th:if="${message != null }"></div>
		
		<div class="row p-2">
			<div class="col-12">
			
				Sorry! You do not have access to the resource. Contact System Administrator.
			</div>
		</div>
		
	</div>
	
	<div class="container" th:replace="~{mobile/fragments :: footer}">
	</div>
	
</body>
</html>
